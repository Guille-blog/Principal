appId: es.talat.ganttobra
productName: Gantt Obra
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
asar: true
fileAssociations:
  - ext: gantt.json
    name: Proyecto Gantt Obra
    description: Planificación Gantt Obra
win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64]
  artifactName: GanttObra-Setup-${version}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Gantt Obra
  language: 3082
